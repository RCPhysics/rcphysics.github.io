research:
  - when: "2021–now"
    title: Laboratory for Advanced Microscopy & Bioengineering (The LAMB)
    org: >-
      ETSU. Founded and leads the LAMB — Raman microspectroscopy, nonlinear
      optical imaging, and bioengineering. $1.3M+ external funding as PI on a
      BioMADE grant; $150K+ in gifts and donations; interdisciplinary
      collaborations across Biomedical Sciences, Biology, Chemistry,
      Geosciences, and Education.
    where: PI
  - when: "2016–2021"
