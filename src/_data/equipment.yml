items:
  - id: "KIT · 01"
    title: Raman & SRS spectroscopy
    photo: ""
    desc: >-
      Label-free vibrational chemical imaging and spectral fingerprinting,
      from single spectra to hyperspectral maps of living samples.
    meta: [Raman, SRS, hyperspectral]

  - id: "KIT · 02"
    title: Nonlinear optical microscopy
    photo: ""
    desc: >-
      Second-harmonic generation, stimulated Raman scattering, and third-order
      sum-frequency generation with vibrational contrast, built on custom
      variable-gain PMT detection.
    meta: [SHG, TSFG, PMT]

  - id: "KIT · 03"
    title: Open-hardware & instrument control
    photo: ""
    desc: >-
      1–2 liter open-source bioreactors, LabVIEW and Arduino-based automation,
      and photonic sensor design — documented so other labs can build them too.
    meta: [open-hardware, LabVIEW, sensors]
