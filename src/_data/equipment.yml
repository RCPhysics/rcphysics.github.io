# =========================================================================
# LAMB equipment & technical expertise — the tools and methods the lab
# builds and operates. Rendered on /lamb/ as work-cards. The science these
# tools are pointed at lives on the Research page (see strands.yml).
#
# Fields: id (mono label) · title · desc · meta (short mono tags)
