- year: 2025
  type: journal
  role: co-author
  venue: Science
  title: Superstable lipid vacuoles endow cartilage with its shape and biomechanics.
  authors:
    - Raul Ramos
    - Kim T. Pham
    - { me: true, name: Richard C. Prince }
    - et al.
  abstract: >-
    This study identifies lipochondrocytes, lipid-filled cells in mammalian
    cartilage, which use de novo lipogenesis to produce stable lipid droplets
    that influence cartilage biomechanics by reducing stiffness and
    resilience — providing a unique alternative to traditional extracellular
    matrix structures.
  tags:
    - { tone: glass, label: "CARS · SHG" }
    - { tone: "",    label: "cartilage" }
  link: https://www.rcphysics.com/files/papers/Ramos et al. - 2025.pdf
  doi: 10.1126/science.xxx

