# ===========================================================================
# .github/workflows/deploy.yml
# ---------------------------------------------------------------------------
# Builds the Eleventy site on every push to main and publishes _site/ to
# GitHub Pages using GitHub's modern Pages actions (no gh-pages branch
# needed).
#
# Before this works:
#   1. In repo Settings → Pages, set Source = "GitHub Actions".
#   2. Push to main once; the action runs and the site appears at
#      https://<user>.github.io/<repo>/ (or your CNAME).
# ===========================================================================

name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
